<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML ブロック練習</title>
<style>
:root{
  --bg:#f7f8f4; --card:#ffffff; --ink:#2b2f33; --sub:#6b7278; --line:#dde2dc;
  --left:#eef6ef; --leftAc:#3f7f50; --right:#edf2f9; --rightAc:#3f5f93;
  --tag:#1f56b0; --tagClose:#9fb5da; --attr:#8a5a14; --val:#2d7a4b; --mark:#fff3bf;
  --pri:#e0773a; --priDk:#c2602a; --glow:#ff9d2e;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* overflow-x:hidden だと sticky（お題・画面の追従）が効かなくなるので clip を使う */
html,body{margin:0;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;font-size:19px;line-height:1.6;-webkit-text-size-adjust:100%}
body.nofuri rt{display:none}
rt{font-size:.5em;color:#555}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:3px solid #2b6fd6;outline-offset:2px}
body.dragnow{user-select:none;-webkit-user-select:none;cursor:grabbing}

/* ---------- 上のバー ---------- */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:8px 16px;background:#4c97ff;color:#fff;box-shadow:0 2px 0 #3373cc}
.top rt{color:rgba(255,255,255,.9)}
.top .ttl{flex:1;min-width:0;font-weight:bold;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);color:#fff;border-radius:14px;padding:6px 14px;min-height:50px;display:inline-flex;align-items:center;gap:6px;font-size:18px;font-weight:bold;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.25)}
.tbtn[aria-pressed="true"]{background:rgba(0,0,0,.12);border-color:#fff}
.tbtn .sw{display:inline-block;width:34px;height:20px;border-radius:10px;background:rgba(255,255,255,.35);position:relative}
.tbtn .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.tbtn[aria-pressed="true"] .sw{background:#ffbf00}
.tbtn[aria-pressed="true"] .sw::after{left:16px}

/* ---------- ステージ選択 ---------- */
.sel{max-width:1100px;margin:0 auto;padding:28px 16px 60px}
.selh{font-size:28px;margin:0 0 22px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
.card{position:relative;border:3px solid var(--line);background:#fff;border-radius:22px;padding:18px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:190px;transition:transform .12s}
.card:hover:not(:disabled){transform:translateY(-2px);border-color:#b8c3b8}
.card .cico{font-size:46px;line-height:1.2}
.card .cnum{font-size:16px;color:var(--sub)}
.card .ctit{font-size:20px;font-weight:bold;text-align:center}
.card .cstar{font-size:26px;color:#d6d6d6;line-height:1}
.card.done .cstar{color:#f2b51d}
.card.done{background:#fffdf3}
.card.next{border-color:var(--pri);box-shadow:0 0 0 5px rgba(224,119,58,.18);animation:bob 1.6s ease-in-out infinite}
.card .nexttag{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--pri);color:#fff;border-radius:20px;padding:2px 14px;font-size:16px;font-weight:bold;white-space:nowrap}
.card.conf{background:#f4f6fb}
.card:disabled{background:#eef0ee}
.card:disabled .cico{filter:grayscale(1);opacity:.5}
.cards .sep{grid-column:1/-1;height:4px;border-top:3px dashed var(--line);margin:4px 0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ---------- 問題画面 ---------- */
.stage{max-width:1400px;margin:0 auto;padding:16px 16px 50px}
.goal{display:flex;align-items:center;gap:18px;background:#fff;border:2px solid var(--line);border-radius:22px;padding:14px 18px;margin-bottom:16px}
.thumb{flex:none;position:relative;width:200px;height:132px;border:2px solid #cfd6cf;border-radius:14px;overflow:hidden;background:#fff;padding:0}
.thumb .pv{width:400px;transform:scale(.5);transform-origin:0 0;pointer-events:none;padding:12px 16px}
.thumb .lens{position:absolute;right:6px;bottom:6px;background:rgba(255,255,255,.95);border:2px solid #cfd6cf;border-radius:12px;padding:0 8px;font-size:15px}
.gmain{flex:1;min-width:0}
.gtext{font-size:24px;font-weight:bold;line-height:1.5}
.robotRow{display:flex;align-items:center;gap:10px;margin-top:6px}
.robot{flex:none;width:56px;height:56px}
.bubble{position:relative;background:#f3f6fa;border:2px solid #cdd7e4;border-radius:16px;padding:6px 14px;font-size:19px}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:#cdd7e4;border-left:0}
.bubble.warm{background:#fff4e8;border-color:#f2c496}
.bubble.warm::before{border-right-color:#f2c496}
.kinds{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.kinds .k{min-width:38px;height:38px;padding:0 8px;border-radius:19px;font-family:Consolas,monospace;border:3px dashed #c7cec7;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:17px;background:#fff}
.kinds .k.on{border-style:solid;border-color:var(--c);background:var(--t);color:var(--tag)}
.cmpBtn{flex:none}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;padding:8px 10px;background:#fffaf0;border:2px dashed #f0c48f;border-radius:14px}
.strip .arr{color:#c58b4a;font-weight:bold}

.main{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.pane{border-radius:16px;padding:16px;min-width:0}
.left{background:#fff;border:1px solid #d9dde6;container-type:inline-size}
.right{background:#e9f1fc;border:1px solid #c5d2e6;position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto}
.ph{margin:0 0 10px;font-size:22px;display:flex;align-items:center;gap:10px;color:#575e75}
.phico{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;color:#fff;font-size:20px;background:#4c97ff}

/* 左：パレット（部品）とならべる所 */
.lgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@container (min-width:860px){ .lgrid{grid-template-columns:250px minmax(0,1fr);align-items:start} .flowdown{display:none} .tray{flex-direction:column;align-items:flex-start} .chip{max-width:240px} }
.trayWrap{--hole:#fff;background:#fff;padding:4px 10px 8px 2px}
.tlabel{font-size:16px;color:#575e75;font-weight:bold;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.tray{display:flex;flex-wrap:wrap;gap:22px 14px;padding-bottom:10px}
.flowdown{text-align:center;color:#a7b3c6;font-size:26px;line-height:1;margin:0}

/* ブロック：白地に種類の色の枠。中身はコード表示と同じ配色（タグは青、閉じタグは薄い青、入力欄は黄色） */
.chip,.blk{position:relative;background:#fff;border:3px solid var(--c);border-radius:14px;color:var(--ink)}
.chip{display:inline-flex;flex-direction:column;align-items:flex-start;gap:4px;padding:10px 14px;min-height:56px;touch-action:none;user-select:none;-webkit-user-select:none;text-align:left}
.chip:hover{background:var(--t)}
.chip.static{cursor:default;touch-action:auto}
.chipcode{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.jcap{font-size:13px;color:var(--sub);line-height:1.3}
.fakepill{display:inline-block;width:44px;height:26px;border-radius:5px;background:var(--mark);border:2px dashed #e0c75c;margin:0 2px}
.fakepill.pic1{width:auto;padding:0 3px;display:inline-flex;align-items:center;border-style:solid}
.fakepill.pic1 img{width:22px;height:22px}

.work{min-height:160px;display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:16px 12px 24px;border-radius:12px;background-color:#f9f9f9;background-image:radial-gradient(#d9dde3 1.2px,transparent 1.2px);background-size:22px 22px;border:1px solid #e3e6ec;transition:background-color .15s}
.work.over{background-color:#e9f1fc;outline:3px dashed #4c97ff;outline-offset:2px}
.drophere{border:3px dashed #c3cad6;border-radius:12px;min-height:110px;display:flex;align-items:center;justify-content:center;color:#8a93a6;font-size:20px;background:rgba(255,255,255,.6)}
.dropline{height:8px;border-radius:4px;background:#4c97ff;flex:none;margin:4px 0}

.blk{min-width:0;transition:box-shadow .15s,background .15s}
.blk.hl{box-shadow:0 0 0 4px #ffd84d;background:var(--t)}
.blk.dragging{opacity:.3}
.brow{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:10px 10px 10px 12px;min-width:0;cursor:grab}
.brow > .badge{margin-right:8px}
.badge{flex:none;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;font-weight:bold;font-size:18px;cursor:grab;touch-action:none}
/* コードの文字（タグ・属性） */
.ct{font-family:Consolas,"BIZ UDGothic","MS Gothic",monospace;font-weight:bold;font-size:20px;color:var(--tag);white-space:nowrap;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.ct.cl{color:var(--tagClose)}
.ct.an{color:var(--attr);font-weight:normal}
.chip .ct{cursor:inherit}
/* 入力欄：コード表示の「自分の文字」と同じ黄色のマーカー。文字数に合わせて伸びる */
.inp{flex:0 1 auto;width:auto;field-sizing:content;min-width:4em;max-width:100%;font-family:"BIZ UDPGothic","Meiryo",sans-serif;font-size:20px;color:#111;padding:2px 8px;margin:0 2px;border:2px solid #e6d27a;border-radius:6px;background:var(--mark)}
.inp:focus{outline:none;border-color:#2b6fd6;box-shadow:0 0 0 3px rgba(43,111,214,.2)}
.inp.empty{border:2px dashed #e7a35c;background:#fff}
.pics{display:flex;flex-wrap:wrap;gap:6px;margin:0 4px}
.pic{border:3px solid #e1e5ea;background:#fff;border-radius:12px;padding:3px 6px;display:flex;flex-direction:column;align-items:center;font-size:14px;min-width:64px;color:#333}
.pic img{width:40px;height:40px}
.pic[aria-pressed="true"]{border-color:var(--c);background:var(--t)}
.pic[aria-pressed="true"]::after{content:"✔";color:var(--d);font-weight:bold;line-height:1}
.ctrl{flex:none;display:flex;gap:6px;margin-left:auto;padding-left:8px}
.cb{width:42px;height:42px;border-radius:50%;border:2px solid #d3d8e0;background:#f6f7f9;color:#575e75;font-size:17px;display:flex;align-items:center;justify-content:center;padding:0}
.cb:hover:not(:disabled){background:#e9edf2}
.cb.del{color:#d6334f;font-size:26px;font-weight:bold;border-color:#f0c4cc;background:#fff6f7}
/* 箇条書き：<ul> の中に <li> が3つ（線でつないで入れ子を見せる） */
.cmouth{position:relative;margin:0 12px 2px 56px;padding-left:22px;border-left:3px solid #b9c7de;display:flex;flex-direction:column;gap:6px}
.liblk{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:2px;border:2px dashed #b9c7de;border-radius:10px;padding:4px 10px;background:#f8fafd;max-width:440px}
.liblk::before{content:"";position:absolute;left:-26px;top:50%;width:22px;border-top:3px solid #b9c7de}
.cfoot{padding:4px 12px 10px 56px;cursor:grab;touch-action:none}
.ochip .ct{font-size:17px}
/* 箱ブロック（header・main・footer）：開始タグと終了タグの間の口に、ほかのブロックが入る */
.kids{position:relative;margin:0 10px 2px 30px;padding:8px 10px;border-left:4px solid var(--c);border-radius:0 10px 10px 0;background:rgba(255,255,255,.55);display:flex;flex-direction:column;gap:8px;min-height:58px}
.blk.box{background:var(--t)}
.blk.box.hl{background:var(--t)}
.blk.box.into{outline:4px solid var(--c);outline-offset:2px}
.blk.box.into > .brow::after{content:"追加先";margin-left:8px;font-size:13px;font-weight:bold;color:#fff;background:var(--c);border-radius:999px;padding:1px 10px}
.kids.over{outline:3px dashed #4c97ff;outline-offset:-3px;background:#e9f1fc}
.kidsempty{border:2px dashed #c3cad6;border-radius:10px;padding:10px;color:#8a93a6;font-size:15px;text-align:center;background:#fff}
@media (max-width:600px){ .kids{margin-left:12px;padding:6px} .kids .cmouth{margin-left:20px} .kids .cfoot{padding-left:20px} }
.fakebox{display:inline-block;padding:0 6px;color:var(--sub);font-weight:bold}
.tlabel{flex-wrap:wrap}
.intoTag{margin-left:auto;font-size:13px;padding:2px 10px;border-radius:999px;background:#eef1f6;color:#575e75;white-space:nowrap}
.intoTag.on{background:#fff3bf}
.intoTag .ct{font-size:13px}
/* 箱を表示：要素ごとの枠とタグ名（開発者ツールの表示に近い） */
.boxtgl{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:bold;color:#46546f;cursor:pointer;user-select:none;white-space:nowrap}
.boxtgl input{width:16px;height:16px;margin:0;accent-color:#0b7d7d;cursor:pointer}
.pv.boxes [data-t]{outline:2px dashed var(--bc,#8a93a6);outline-offset:-1px;position:relative}
.pv.boxes :is(h1,h2,p,ul,li,header,main,footer)[data-t]{padding:18px 8px 6px}
.pv.boxes ul[data-t]{padding-left:40px}
.pv.boxes li[data-t]{padding:16px 6px 4px;margin:4px 0}
.pv.boxes :is(header,main,footer)[data-t]{margin:8px 0;min-height:44px;outline-width:3px;outline-style:solid}
.pv.boxes :is(h1,h2,p,ul,li,header,main,footer)[data-t]::before{content:"<" attr(data-t) ">";position:absolute;top:2px;left:4px;font:bold 11px/1.2 Consolas,monospace;color:#fff;background:var(--bc,#8a93a6);padding:1px 5px;border-radius:4px}
.pv.boxes :is(a,strong)[data-t]::before{content:"<" attr(data-t) ">";font:bold 10px/1.2 Consolas,monospace;color:#fff;background:var(--bc,#8a93a6);padding:1px 4px;border-radius:3px;margin-right:3px;vertical-align:middle}
.pv.boxes .hl{outline:4px solid var(--c);outline-offset:2px}
.boxtgl + .boxtgl{margin-left:12px}
.why{max-width:520px;margin:4px auto 14px;text-align:left;font-size:16px;line-height:1.7;background:#f3fbfb;border:2px solid #9fd8d8;border-radius:12px;padding:10px 14px;color:#2b3a3a}
.why b{display:block;color:#0b7d7d;margin-bottom:2px}
.wrongfig .pv{min-height:170px}
/* 共通の部分の練習：ページ切り替えタブと、3ページを並べた説明 */
.pgtabs{display:flex;gap:4px;margin:0 0 6px;flex-wrap:wrap}
.pgtab{border:2px solid #c5d2e6;border-bottom-width:3px;background:#f3f6fb;border-radius:10px 10px 4px 4px;padding:2px 7px;font-size:13px;font-weight:bold;color:#5b6f8f;white-space:nowrap}
.pgtab[aria-selected="true"]{background:#fff;border-color:#0fa3a3;color:#0b7d7d}
.pgtab.seen::after{content:" ✔";color:#389438}
.pagesfig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pagesfig h3{margin:0 0 4px;font-size:14px;color:#575e75}
.pagesfig .pv{min-height:150px;font-size:12px}
@media (max-width:600px){ .pagesfig{grid-template-columns:minmax(0,1fr)} }
/* デザインを付ける：実際のサイトのように、箱ごとに見た目を決める（CSS の役割の体験） */
.pv.design{padding:0;background:#eef1f5;display:flex;flex-direction:column}
.pv.design > .sfit{display:flex;flex-direction:column;flex:1 0 auto}
:is(.pv.design,.pv.design > .sfit) > :not(header,main,footer,.pvempty,.sfit){margin-left:20px;margin-right:20px}
:is(.pv.design,.pv.design > .sfit) > header{background:#0b7d7d;color:#fff;padding:14px 20px;margin:0}
:is(.pv.design,.pv.design > .sfit) > header :is(h1,h2){margin:0;color:#fff}
:is(.pv.design,.pv.design > .sfit) > header p{margin:.3em 0 0;color:#d8f1f1}
:is(.pv.design,.pv.design > .sfit) > header a{color:#fff}
:is(.pv.design,.pv.design > .sfit) > main{background:#fff;margin:12px;padding:10px 18px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
:is(.pv.design,.pv.design > .sfit) > main > :first-child{margin-top:0}
:is(.pv.design,.pv.design > .sfit) > footer{margin-top:auto;background:#3a3f4a;color:#c3c8d0;font-size:12px;padding:10px 20px;text-align:center}
:is(.pv.design,.pv.design > .sfit) > footer :is(h1,h2,p,ul){font-size:1em;font-weight:normal;margin:.2em 0}
:is(.pv.design,.pv.design > .sfit) > footer a{color:#c3c8d0}
.pv.design .pvempty{padding:14px 20px}
/* 練習11の説明：ページの3つの箱 */
.pgfig{display:flex;flex-direction:column;gap:6px;max-width:460px;margin:0 auto}
.pgbox{display:flex;align-items:center;gap:12px;border:3px solid var(--c);background:var(--t);border-radius:10px;padding:8px 14px;font-size:16px}
.pgbox:nth-child(2){min-height:90px}
/* 箱の正解の形 */
.tstrip{flex-direction:column;align-items:stretch}
.tbox{border:2px solid var(--c);background:var(--t);border-radius:8px;padding:4px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tkids{display:flex;flex-wrap:wrap;gap:4px}
.tnone{font-size:12px;color:var(--sub)}

.wbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.sbtn{border:1px solid #c9d0dc;background:#fff;border-radius:999px;min-height:52px;padding:6px 18px;font-size:18px;color:#575e75;font-weight:bold}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;align-items:center}
.donebtn{flex:1;min-width:200px;border:0;border-radius:20px;background:#59c059;color:#fff;font-size:28px;font-weight:bold;min-height:72px;box-shadow:0 5px 0 #389438}
.donebtn:active{transform:translateY(3px);box-shadow:0 2px 0 #389438}
.skipbtn{border:1px solid #c9d0dc;background:#fff;border-radius:16px;min-height:56px;padding:6px 16px;font-size:17px;color:var(--sub)}

/* 右：表示結果（常に表示） */
.right .ph .phico{background:#59c059}
.right #pv{min-height:300px}
.pv .flash{animation:pvflash 1.2s ease-out 1}
@keyframes pvflash{0%{background:transparent}25%{background:#fff3bf}100%{background:transparent}}

/* ブラウザ風の枠とプレビュー */
.browser{background:#fff;border:3px solid #c5d2e6;border-radius:16px;overflow:hidden}
.bbar{display:flex;gap:6px;align-items:center;padding:8px 12px;background:#e6ecf5;border-bottom:2px solid #d3dcea}
.bbar i{width:12px;height:12px;border-radius:50%;background:#c3ccd9;display:block}
.bbar .bl{margin-left:8px;font-size:15px;color:#6a7a92}
.pv{padding:14px 20px;min-height:120px;font-family:"BIZ UDPGothic","Meiryo",sans-serif;font-size:16px;line-height:1.5;color:#000;overflow-wrap:anywhere}
.pv h1{font-size:2em;font-weight:bold;margin:.67em 0}
.pv h2{font-size:1.5em;font-weight:bold;margin:.83em 0}
.pv p{margin:1em 0}
.pv ul{margin:1em 0;padding-left:40px;list-style:disc}
.pv hr{border:0;border-top:2px solid #aaa;margin:.5em 0}
.pv img{max-width:100%;vertical-align:bottom}
.pv a{color:#0b3dd6;text-decoration:underline;cursor:pointer}
.pv strong{font-weight:bold}
.pv > :first-child{margin-top:0}
.pv .hl{outline:4px solid var(--c);outline-offset:3px;border-radius:2px}
.pvempty{color:#aab3c0;text-align:center;padding:30px 0;font-size:18px}

/* ---------- モーダル ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(40,48,44,.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
.mbox{background:#fff;border-radius:26px;max-width:880px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25);margin:auto 0}
.mtitle{font-size:26px;font-weight:bold;margin:0 0 14px;text-align:center}
.mbtns{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:20px}
.bigok{border:0;border-radius:20px;background:var(--pri);color:#fff;font-size:24px;font-weight:bold;min-height:64px;padding:6px 36px;box-shadow:0 5px 0 var(--priDk)}
.bigok:active{transform:translateY(3px);box-shadow:0 2px 0 var(--priDk)}

function hlCode(code){
  return esc(code).replace(/&lt;(\/?)(\w+)(.*?)&gt;/g, (m, sl, name, attrs) => {
    const cls = sl ? 'tc' : 'tg';
    const a = attrs.replace(/(\w+)=&quot;(.*?)&quot;/g, '<span class="an">$1</span>=<span class="av">&quot;$2&quot;</span>');
    return '<span class="' + cls + '">&lt;' + sl + name + '</span>' + a + '<span class="' + cls + '">&gt;</span>';
  });
}
// 使用例を画面に出すときは、画像のファイル名だけアプリ内の絵に差し替える
const exPreview = code => code.replace(/src="([^"]+)\.svg"/g, (m, n) => { const p = PICS.find(x => x.name === n); return 'src="' + (p ? picURI(p.id) : '') + '"'; });

let uid = 0;
function newBlock(type, v){
  const b = Object.assign({id:'b' + (++uid), type:type}, TYPES[type].def());
  if (v !== undefined){
    if (isBox(type)) b.kids = mk(v);
    else if (type === 'ul') b.items = v.slice();
    else if (type === 'img') b.pic = v;
    else if (type === 'a'){ b.text = v[0]; b.href = v[1]; }
    else b.text = v;
  }
  return b;
}
const mk = list => (list || []).map(x => newBlock(x[0], x[1]));
// 箱の中も含めて、上から順（コードの順）に全部のブロックを並べる
const flat = blocks => [].concat.apply([], blocks.map(b => [b].concat(b.kids ? flat(b.kids) : [])));
// id のブロックが入っている配列と位置（p は入っている箱の id。一番外側なら null）
function findLoc(id, blocks, p){
  blocks = blocks || S.blocks;
  for (let i = 0; i < blocks.length; i++){
    const b = blocks[i];
    if (b.id === id) return {arr:blocks, i:i, b:b, p:p || null};
    if (b.kids){ const r = findLoc(id, b.kids, b.id); if (r) return r; }
  }
  return null;
}
const findBlock = id => { const l = findLoc(id); return l && l.b; };
const kidsOf = p => p ? findBlock(p).kids : S.blocks;
// 置ける場所の一覧（コードの順）。箱は一番外側だけ、ほかのブロックは箱の中にも置ける
function slotsFor(blocks, box){
  const out = [];
  blocks.forEach((b, i) => {
    out.push({p:null, i:i});
    if (!box && b.kids) for (let k = 0; k <= b.kids.length; k++) out.push({p:b.id, i:k});
  });
  out.push({p:null, i:blocks.length});
  return out;
}
// ▲▼で1つ上・下の場所へ。箱の端では箱の外へ出る／隣の箱に入る
function stepPos(id, dir){
  const l = findLoc(id); if (!l) return null;
  const rest = S.blocks.filter(b => b.id !== id).map(b => b.kids ? Object.assign({}, b, {kids:b.kids.filter(k => k.id !== id)}) : b);
  const sl = slotsFor(rest, !!l.b.kids);
  const k = sl.findIndex(s => s.p === l.p && s.i === l.i);
  return sl[k + dir] || null;
}
// 構造を文字にする（例：header(h1),main(p,ul)）。答え合わせに使う
const sig = blocks => blocks.map(b => b.type + (b.kids ? '(' + sig(b.kids) + ')' : '')).join(',');
function isEmpty(b){
  if (b.kids) return false;
  if (b.type === 'ul') return b.items.some(t => !t.trim());
  if (b.type === 'a') return !b.text.trim() || !b.href.trim();
  if ('text' in b) return !b.text.trim();
  return false;
}

function pvHTML(blocks, withIds){
  return blocks.map((b, i) => {
    // data-t はタグ名（「箱を表示」で枠と名前を出すのに使う）
    const t0 = b.type === 'strong' ? 'p' : b.type;
    const d = ' data-t="' + t0 + '"' + (withIds ? ' data-id="' + b.id + '" style="--c:' + COL[b.type][1] + '"' : '');
    switch (b.type){
      case 'h1': case 'h2': case 'p': return '<' + b.type + d + '>' + esc(b.text) + '</' + b.type + '>';
      case 'strong': return '<p' + d + '><strong data-t="strong">' + esc(b.text) + '</strong></p>';
      case 'hr': return '<hr' + d + '>';
      case 'img': return '<img' + d + ' src="' + picURI(b.pic) + '" alt="' + esc(picById(b.pic).name) + '">';
      case 'a': return '<a' + d + ' href="' + esc(b.href) + '" draggable="false">' + esc(b.text) + '</a>';
      case 'ul': return '<ul' + d + '>' + b.items.map(t => '<li data-t="li">' + esc(t) + '</li>').join('') + '</ul>';
      case 'header': case 'main': case 'footer': return '<' + b.type + d + '>' + pvHTML(b.kids, withIds) + '</' + b.type + '>';
    }
    return '';
  }).join('\n');
}

const BO = t => '<span class="ct" data-tag="' + t + '">&lt;' + t + '&gt;</span>';
const BC = t => '<span class="ct cl" data-tag="' + t + '">&lt;/' + t + '&gt;</span>';
const BT = (s, t) => '<span class="ct" data-tag="' + t + '">' + s + '</span>';
const BA = (s, t) => '<span class="ct an" data-tag="' + t + '">' + s + '</span>';
const shortTag = t => '&lt;' + t + '&gt;';
function face(type, slot){
  switch (type){
    case 'h1': case 'h2': case 'p': return BO(type) + slot('text') + BC(type);
    case 'strong': return BO('p') + BO('strong') + slot('text') + BC('strong') + BC('p');
    case 'hr': return BO('hr');
    case 'img': return BT('&lt;img', 'img') + BA('&nbsp;src="', 'src') + slot('pic') + BA('"', 'src') + BT('&gt;', 'img');
    case 'a': return BT('&lt;a', 'a') + BA('&nbsp;href="', 'href') + slot('href') + BA('"', 'href') + BT('&gt;', 'a') + slot('text') + BC('a');
    case 'ul': return BO('ul') + slot('items') + BC('ul');
    case 'header': case 'main': case 'footer': return BO(type) + slot('kids') + BC(type);
  }
  return '';
}

function bindStage(){
  const st = cur();
  $('#thumbBtn').addEventListener('click', () => st.cmp ? showCompare() : showSample());
  if (st.cmp) $('#cmpBtn').addEventListener('click', showCompare);
  $('#undoBtn').addEventListener('click', undo);
  $('#clearBtn').addEventListener('click', () => { if (S.blocks.length) change(() => { S.blocks = []; S.into = null; }); });
  $('#doneBtn').addEventListener('click', judge);
  $('#saveBtn').addEventListener('click', showSave);
  $$('.vtab').forEach(t => t.addEventListener('click', () => {
    const code = t.dataset.view === 'code';
    $$('.vtab').forEach(x => x.setAttribute('aria-selected', x === t));
    $('#pv').closest('.browser').hidden = code;
    $('.editor').hidden = !code;
    setHL(S.hl);
  }));
  if ($('#jcapChk')) $('#jcapChk').addEventListener('change', e => { $('.pane.left').classList.toggle('hidejcap', !e.target.checked); });
  if ($('#skipBtn')) $('#skipBtn').addEventListener('click', goNext);
  // 箱を表示：見本と自分の画面の両方に、要素の枠とタグ名を出す
  $('#boxChk').addEventListener('change', e => {
    S.boxes = e.target.checked;
    $$('#app .pv').forEach(v => v.classList.toggle('boxes', S.boxes));
    fitSample();
  });
  // ページの切り替え（共通の部分の練習）：ヘッダー・フッターはそのまま、main だけが変わる
  $$('.pgtab').forEach(t => t.addEventListener('click', () => {
    S.page = +t.dataset.pg;
    if (S.seen.indexOf(S.page) < 0) S.seen.push(S.page);
    $$('.pgtab').forEach(x => {
      x.setAttribute('aria-selected', x === t);
      x.classList.toggle('seen', S.seen.indexOf(+x.dataset.pg) >= 0);
      x.classList.remove('glow');
    });
    renderPreview(); setHL(S.hl);
  }));
  // デザインを付ける：箱ごとに見た目が決まる（上部は色の帯、下部は灰色の小さな文字）
  if ($('#designChk')) $('#designChk').addEventListener('change', e => {
    prog.design = e.target.checked; saveProg();
    $$('#app .pv').forEach(v => v.classList.toggle('design', prog.design));
    fitSample();
  });

  // トレー：タグをクリック → 使用例。それ以外（＋追加など）をクリック → 追加。ドラッグで好きな場所へ
  $$('#tray .chip').forEach(ch => {
    ch.addEventListener('click', e => {
      if (Date.now() - justDragged < 400) return;
      const ct = e.target.closest('.ct[data-tag]');
      if (ct) showTagInfo(ct.dataset.tag); else addBlock(ch.dataset.type);
    });
    ch.addEventListener('pointerdown', e => dragStart(e, 'tray', ch.dataset.type, ch));
  });

  const work = $('#work');
  work.addEventListener('click', e => {
    const blk = e.target.closest('.blk');
    // 箱（またはその中）をクリック → 「＋追加」の入れ先にする。箱の外をクリック → 一番外側に戻す
    if (cur().tree && !e.target.closest('button, input, .ct') && Date.now() - justDragged > 400){
      const bx = e.target.closest('.blk.box');
      setInto(bx ? bx.dataset.id : null);
    }
    if (!blk) return;
    const id = blk.dataset.id;
    const act = e.target.closest('[data-act]');
    if (act){
      const l = findLoc(id);
      if (act.dataset.act === 'del') change(() => { l.arr.splice(l.i, 1); if (S.into && !findBlock(S.into)) S.into = null; });
      if (act.dataset.act === 'up' || act.dataset.act === 'down'){
        const to = stepPos(id, act.dataset.act === 'up' ? -1 : 1);
        if (to) moveTo(id, to);
      }
      return;
    }
    const pic = e.target.closest('[data-pic]');
    if (pic){
      const b = findBlock(id);
      if (b.pic !== pic.dataset.pic) change(() => { b.pic = pic.dataset.pic; });
      return;
    }
    // タグをクリック → 使用例
    const ct = e.target.closest('.ct[data-tag]');
    if (ct && Date.now() - justDragged > 400) showTagInfo(ct.dataset.tag);
  });
  work.addEventListener('focusin', e => {
    if (!e.target.matches('.inp')) return;
    S.editSnap = false;
    if (cur().tree){ const bx = e.target.closest('.blk.box'); setInto(bx ? bx.dataset.id : null); }
  });
  work.addEventListener('input', e => {
    const inp = e.target; if (!inp.matches('.inp')) return;
    const b = findBlock(inp.closest('.blk').dataset.id); if (!b) return;
    if (!S.editSnap){ pushUndo(); S.editSnap = true; }
    if (inp.dataset.f === 'items') b.items[+inp.dataset.k] = inp.value;
    else b[inp.dataset.f] = inp.value;
    inp.classList.toggle('empty', !inp.value.trim());
    clearHints();
    renderPreview(); renderKinds(); updateUndo();
    setHL(S.hl);
  });
  work.addEventListener('pointerdown', e => {
    if (e.target.closest('input, button')) return;
    const h = e.target.closest('.badge, .ct, .brow, .cfoot'); if (!h) return;
    const blk = h.closest('.blk');
    dragStart(e, 'blk', blk.dataset.id, blk);
  });
}

// 「＋追加」の入れ先：選んだ箱を目立たせて、部品一覧の上に入れ先を出す
function setInto(id){
  if (id === S.into) return;
  S.into = id && findBlock(id) ? id : null;

function showInto(){
  $$('#work .blk.box').forEach(el => el.classList.toggle('into', el.dataset.id === S.into));

function inp(field, val, k){
  return '<input class="inp' + (val.trim() ? '' : ' empty') + '" data-f="' + field + '"' + (k !== undefined ? ' data-k="' + k + '"' : '') + ' value="' + esc(val) + '" aria-label="' + (field === 'href' ? 'リンク先' : '文字') + '" autocomplete="off"' + (field === 'href' ? ' inputmode="url" spellcheck="false"' : '') + '>';
}
// no は {n:数} の番号カウンター（数字だけを渡したときはその番号を使う）
function blkHTML(b, no){
  if (typeof no === 'number') no = {n:no};
  const i = no.n++;
  const slot = f => {
    if (f === 'text' || f === 'href') return inp(f, b[f]);
    if (f === 'pic') return '<span class="pics">' + PICS.map(pc => '<button class="pic" data-pic="' + pc.id + '" aria-pressed="' + (b.pic === pc.id) + '"><img src="' + picURI(pc.id) + '" alt=""><span>' + pc.name + '</span></button>').join('') + '</span>';
    return '';
  };
  // 箇条書き：<ul> の中に <li> が3つ、下に </ul>
  const isUl = b.type === 'ul', box = !!b.kids;
  const top = isUl || box ? BO(b.type) : face(b.type, slot);
  let inner = '';
  if (isUl) inner = '<div class="cmouth">' + b.items.map((t, k) => '<div class="liblk">' + BO('li') + inp('items', t, k) + BC('li') + '</div>').join('') + '</div><div class="cfoot">' + BC('ul') + '</div>';
  // 箱：開始タグと終了タグの間（口）に、ほかのブロックがそのまま入る
  if (box) inner = '<div class="kids" data-p="' + b.id + '">' + (b.kids.length ? b.kids.map(k => blkHTML(k, no)).join('') : '<div class="kidsempty">' + fu('ここにブロックが{入|はい}ります') + '</div>') + '</div><div class="cfoot">' + BC(b.type) + '</div>';
  const inS = !!findLoc(b.id);   // 並べる場所のブロックか（使い方の説明の絵ではない）
  const upOk = inS && !!stepPos(b.id, -1), downOk = inS && !!stepPos(b.id, 1);
  return '<div class="blk' + (box ? ' box' : '') + '" data-id="' + b.id + '" style="' + colVars(b.type) + '">' +
    '<div class="brow"><span class="badge">' + (i + 1) + '</span>' + top +
    '<span class="ctrl"><button class="cb" data-act="up" aria-label="上へ"' + (upOk ? '' : ' disabled') + '>▲</button>' +
    '<button class="cb" data-act="down" aria-label="下へ"' + (downOk ? '' : ' disabled') + '>▼</button>' +
    '<button class="cb del" data-act="del" aria-label="削除">×</button></span></div>' + inner + '</div>';
}
function renderPreview(){

const unesc = s => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');
// 右の「コード」：本物のエディタのように、行番号付きでファイル全体を表示。ブロックごとの行に data-id を付けて連動させる
function renderCodeV(){
  const el = $('#codeV'); if (!el) return;
  const V = viewBlocks(), L = pageLines(V, false);
  if (cur().pages) $('#etab').textContent = PAGES[S.page].file;   // 見ているページのファイル名

  const line = raw => '<span class="eln"><span class="lnno">' + (++n) + '</span><span class="ltx">' + hlCode(raw) + '</span></span>';
  // 箱は「開始タグの行・中身のブロック・終了タグの行」に分け、中身も1つずつ連動できるようにする
  const blk = (b, ind) => '<span class="eblk' + (b.id === S.flashId ? ' flash' : '') + '" data-id="' + b.id + '">' +
    (b.kids ? line(ind + '<' + b.type + '>') + b.kids.map(k => blk(k, ind + '  ')).join('') + line(ind + '</' + b.type + '>')
            : blockLines(b, false).map(l => line(unesc(ind + l))).join('')) + '</span>';
  el.innerHTML = L.head.map(l => line(unesc(l))).join('') +

}
function renderKinds(){
  const el = $('#kinds'); if (!el) return;

  const need = cur().free;

  }

function updateUndo(){ const u = $('#undoBtn'); if (u) u.disabled = !S.undo.length; }
/* 見本と右の画面を、同じ位置・同じ高さのブラウザ枠にそろえる（3列表示のときだけ）。
   見本は左の列に収まるように縮小し、右の画面は中身が長いと枠の中でスクロールする */
function fitSample(){
  const info = $('.main3 .info'), box = $('#sampleBox'), inner = box && $('.sfit', box);
  const pvR = $('#pv'), right = pvR && pvR.closest('.right'), brR = $('#viewWrap'), codeV = $('#codeV');
  if (!info || !inner || !pvR || !brR) return;
  const pvS = inner.closest('.pv');
  inner.style.zoom = 1; pvS.style.height = ''; pvR.style.height = ''; pvR.style.minHeight = ''; pvR.style.overflow = ''; brR.style.marginTop = '';
  if (codeV) codeV.style.height = '';
  $$('img', inner).forEach(i => { if (!i.complete) i.addEventListener('load', fitSample, {once:true}); });
  // 左右の列が横に並んでいて、どちらも追従表示のときだけそろえる
  const sideBySide = getComputedStyle(info).position === 'sticky' && Math.abs(info.getBoundingClientRect().top - right.getBoundingClientRect().top) < 2;
  if (!sideBySide) return;
  const limit = parseFloat(getComputedStyle(info).maxHeight) || window.innerHeight;
  const others = info.scrollHeight - box.offsetHeight;     // 見本以外の高さ
  const frame = box.offsetHeight - inner.offsetHeight;     // ブラウザ枠などの高さ
  const room = Math.max(120, limit - others - frame - 4);  // 見本の中身に使える高さ
  const natural = inner.offsetHeight, pad = pvS.offsetHeight - natural;   // 縮小する前に測る
  const apply = rm => {
    inner.style.zoom = natural > rm ? Math.max(0.35, rm / natural) : 1;
    pvS.style.height = (pad + rm) + 'px';
  };
  let rm = room;
  apply(rm);
  // 文字の折り返しなどで、まだ左の列からはみ出していれば、はみ出た分だけ小さくする
  for (let k = 0; k < 3 && info.scrollHeight > info.clientHeight && rm > 120; k++){
    rm = Math.max(120, rm - (info.scrollHeight - info.clientHeight) - 2);
    apply(rm);
  }
  const pvH = pad + rm;
  pvR.style.height = pvH + 'px'; pvR.style.minHeight = '0'; pvR.style.overflow = 'auto';
  if (codeV) codeV.style.height = pvH + 'px';   // コード画面も同じ高さ（枠の上の帯も同じ高さにしてある）
  // 右の枠の上端を、見本の枠の上端に合わせる
  const brS = box.querySelector('.browser');
  const gap = (brS.getBoundingClientRect().top - info.getBoundingClientRect().top) - (brR.getBoundingClientRect().top - right.getBoundingClientRect().top);
  // （brR は右の枠を包む #viewWrap。ブラウザとコードのどちらを表示していても同じ位置になる）
  // 上の見出しの下余白と重なる（相殺される）ので、その分を足す
  const above = brR.previousElementSibling ? parseFloat(getComputedStyle(brR.previousElementSibling).marginBottom) || 0 : 0;
  if (gap > 0) brR.style.marginTop = (gap + above) + 'px';
}
// 画面の大きさが変わったら、レイアウトが落ち着いた次の描画でそろえ直す
let refitTimer = 0;
const refit = () => {
  requestAnimationFrame(() => requestAnimationFrame(fitSample));
  clearTimeout(refitTimer); refitTimer = setTimeout(fitSample, 300);   // 念のため少し後にもう一度
};
window.addEventListener('resize', refit);
// 3列⇔縦並びの切り替わりでも、そろえ直す（または解除する）
['(max-width:1180px)', '(max-width:960px)'].forEach(m => {
  const mq = window.matchMedia(m);
  if (mq.addEventListener) mq.addEventListener('change', refit); else if (mq.addListener) mq.addListener(refit);
});
function setBubble(html, warm){
  const b = $('#bubble'); if (!b) return;
  b.innerHTML = html; b.classList.toggle('warm', !!warm);
  fitSample();
  // 左の列がスクロールしていても、ヒントが出たら見える位置まで動かす
  const info = b.closest('.info');
  if (warm && info && info.scrollHeight > info.clientHeight){
    info.scrollTop += b.getBoundingClientRect().top - info.getBoundingClientRect().top - 80;
  }
}

/* ===================== 操作 ===================== */
function pushUndo(){ S.undo.push(JSON.stringify(S.blocks)); if (S.undo.length > 60) S.undo.shift(); }
function change(fn){
  pushUndo(); fn(); clearHints(); setBubble(fu(cur().robot)); renderAll();
}
function undo(){
  if (!S.undo.length) return;
  S.blocks = JSON.parse(S.undo.pop());
  clearHints(); renderAll();
}
// pos は {p:箱の id（一番外側なら null）, i:位置}。省略すると「＋追加」の入れ先の最後
function addBlock(type, pos){
  if (!pos){
    if (S.into && !isBox(type)) pos = {p:S.into, i:findBlock(S.into).kids.length};
    else if (S.into) pos = {p:null, i:findLoc(S.into).i + 1};   // 箱は、選んでいる箱のすぐ後ろへ
    else pos = {p:null, i:S.blocks.length};
  }
  change(() => {
    const b = newBlock(type);
    kidsOf(pos.p).splice(pos.i, 0, b); S.flashId = b.id;
    if (b.kids) S.into = b.id;   // 箱を置いたら、続けてその中に入れられるようにする
  });
}
function moveTo(id, pos){
  const l = findLoc(id);
  if (!l || l.p === pos.p && l.i === pos.i) return;
  change(() => { l.arr.splice(l.i, 1); kidsOf(pos.p).splice(pos.i, 0, l.b); });
}

/* 連動ハイライト：左のブロックと右の画面の同じ data-id を光らせる */
const HL_SEL = '#work [data-id], #pv [data-id], #codeV [data-id]';
function setHL(id){
  S.hl = id;

/* ===================== ドラッグ（マウス・タッチ共通） ===================== */
let drag = null, justDragged = 0;
function dragStart(e, kind, val, el){
  if (e.button > 0 || drag) return;
  drag = {kind:kind, val:val, el:el, x0:e.clientX, y0:e.clientY, pid:e.pointerId, active:false, idx:-1, ghost:null, line:null};
}
function dragActivate(e){
  hideTip();
  const r = drag.el.getBoundingClientRect();
  const g = drag.el.cloneNode(true);
  g.classList.add('ghost'); g.classList.remove('hl');
  g.style.width = r.width + 'px';
  drag.offX = e.clientX - r.left; drag.offY = e.clientY - r.top;
  document.body.appendChild(g);
  drag.ghost = g;
  drag.line = document.createElement('div'); drag.line.className = 'dropline';
  if (drag.kind === 'blk') drag.el.classList.add('dragging');
  document.body.classList.add('dragnow');
  drag.active = true;
  setHL(null);
}
function dragOver(x, y){
  const work = $('#work'), wr = work.getBoundingClientRect();
  const inside = x >= wr.left - 40 && x <= wr.right + 40 && y >= wr.top - 70 && y <= wr.bottom + 70;
  if (drag.kind === 'tray' && !inside){
    drag.idx = -1; work.classList.remove('over'); if (drag.line.parentNode) drag.line.remove(); return;
  }
  work.classList.toggle('over', drag.kind === 'tray');
  // 箱の口の上なら、その箱の中へ（箱そのものは一番外側にだけ置ける）
  const dragBox = drag.kind === 'tray' ? isBox(drag.val) : !!(findBlock(drag.val) || {}).kids;
  let par = work, pid = null;
  if (!dragBox){
    const m = $$('.kids', work).find(k => {
      if (drag.el.contains(k)) return false;
      const r = k.getBoundingClientRect(); return y >= r.top - 4 && y <= r.bottom + 4;
    });
    if (m){ par = m; pid = m.dataset.p; }
  }
  $$('.kids.over', work).forEach(k => k.classList.remove('over'));
  if (pid) par.classList.add('over');
  const els = $$(':scope > .blk', par).filter(el => el !== drag.el);
  let idx = els.length;
  for (let k = 0; k < els.length; k++){ const r = els[k].getBoundingClientRect(); if (y < r.top + r.height / 2){ idx = k; break; } }
  drag.idx = {p:pid, i:idx};
  const drop = $('.drophere', work);
  if (drop) drop.remove();
  if (idx < els.length) par.insertBefore(drag.line, els[idx]); else par.appendChild(drag.line);
}
function dragEnd(){
  if (!drag) return;
  if (drag.ghost) drag.ghost.remove();
  if (drag.line && drag.line.parentNode) drag.line.remove();
  if (drag.el) drag.el.classList.remove('dragging');
  const w = $('#work'); if (w){ w.classList.remove('over'); $$('.kids.over', w).forEach(k => k.classList.remove('over')); }
  document.body.classList.remove('dragnow');
  drag = null;
}
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  if (!drag.active){
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 8) return;
    dragActivate(e);
  }
  e.preventDefault();
  drag.ghost.style.transform = 'translate(' + (e.clientX - drag.offX) + 'px,' + (e.clientY - drag.offY) + 'px) scale(.97)';
  dragOver(e.clientX, e.clientY);
  if (e.clientY < 90) window.scrollBy(0, -14);
  else if (e.clientY > window.innerHeight - 70) window.scrollBy(0, 14);
}, {passive:false});
window.addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag;
  dragEnd();
  if (!d.active) return;
  justDragged = Date.now();
  if (d.kind === 'tray'){ if (d.idx !== -1) addBlock(d.val, d.idx); else renderWork(); }
  else if (d.idx !== -1) moveTo(d.val, d.idx);
  if (d.kind === 'blk' && $('#work') && !$('#work .blk')) renderWork();
});
window.addEventListener('pointercancel', () => { if (drag){ dragEnd(); if (S.screen === 'stage') renderWork(); } });

/* ===================== 判定とヒント ===================== */
function countMap(arr){ const m = {}; arr.forEach(t => { m[t] = (m[t] || 0) + 1; }); return m; }
function missingOf(need, have){
  const m = countMap(have), out = [];
  need.forEach(t => { if (m[t]) m[t]--; else out.push(t); });
  return out;
}
function extraIdx(target, have){
  const m = countMap(target), out = [];
  have.forEach((t, i) => { if (m[t]) m[t]--; else out.push(i); });
  return out;
}
function clearHints(){
  $$('.glow').forEach(e => e.classList.remove('glow'));
  $$('.posTag').forEach(e => e.remove());
}
function glowTray(types){ $$('#tray .chip').forEach(c => { if (types.indexOf(c.dataset.type) >= 0) c.classList.add('glow'); }); }
function glowBlock(i, tag){
  const el = $$('#work .blk')[i]; if (!el) return;
  el.classList.add('glow');
  if (tag){ const t = document.createElement('span'); t.className = 'posTag'; t.textContent = tag; el.appendChild(t); }
  el.scrollIntoView({block:'nearest', behavior:'smooth'});
}
function stripHTML(types, ordered){
  return '<div class="strip">' + types.map((t, i) =>
    (i && ordered ? '<span class="arr" aria-hidden="true">▶</span>' : '') +
    '<span class="ochip" style="' + colVars(t) + '">' + (ordered ? '<span class="badge" style="width:28px;height:28px;font-size:15px">' + (i + 1) + '</span>' : '') + '<span class="ct">' + shortTag(t) + '</span></span>'
  ).join('') + '</div>';
}
function shakeDone(){ const d = $('#doneBtn'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); }

// 箱の正解の形（箱の中に部品のチップを並べた図）
function treeStrip(blocks){
  const chip = b => '<span class="ochip" style="' + colVars(b.type) + '"><span class="ct">' + shortTag(b.type) + '</span></span>';
  return '<div class="strip tstrip">' + blocks.map(b => b.kids
    ? '<div class="tbox" style="' + colVars(b.type) + '"><span class="ct">' + shortTag(b.type) + '</span><div class="tkids">' + (b.kids.map(chip).join('') || '<span class="tnone">' + fu('（{空|から}）') + '</span>') + '</div></div>'
    : chip(b)).join('') + '</div>';
}
// 箱の中身まで含めた答え合わせ。上から順に「どの箱の中の、何の部品か」を比べる
function judgeTree(st){
  const tgB = mk(st.sample);
  if (sig(S.blocks) === sig(tgB)) return true;
  const toks = blocks => [].concat.apply([], blocks.map(b => [{t:b.type, p:''}].concat(b.kids ? b.kids.map(k => ({t:k.type, p:b.type})) : [])));
  const have = toks(S.blocks), want = toks(tgB);
  S.fails++; shakeDone();
  if (st.k === 'c'){ setBubble(fu('{見本|みほん}と{比較|ひかく}して、もう{一度|いちど}{確認|かくにん}してみましょう'), true); return false; }
  let w = 0; while (w < Math.min(have.length, want.length) && have[w].t === want[w].t && have[w].p === want[w].p) w++;
  const miss = missingOf(want.map(x => x.t), have.map(x => x.t));
  const glowPos = () => { if (w < have.length) glowBlock(w, (w + 1) + '番目'); else glowTray([want[w].t]); };
  if (S.fails === 1){
    if (miss.length){ setBubble(fu('{足|た}りない{部品|ぶひん}が{光|ひか}っています'), true); glowTray(miss); }
    else setBubble(fu('{惜|お}しい！{箱|はこ}の{中|なか}と{外|そと}を{見本|みほん}と{比|くら}べてみましょう。「{箱|はこ}を{表示|ひょうじ}」を{使|つか}うと{分|わ}かりやすくなります'), true);
  } else if (S.fails === 2){
    const x = want[w], y = have[w];
    if (x && y && x.t === y.t) setBubble(x.p ? (w + 1) + fu('{番目|ばんめ}の ') + shortTag(x.t) + fu(' は ') + shortTag(x.p) + fu(' の{中|なか}に{入|い}れます') : (w + 1) + fu('{番目|ばんめ}の ') + shortTag(x.t) + fu(' は{箱|はこ}の{外|そと}に{置|お}きます'), true);
    else if (x) setBubble((w + 1) + fu('{番目|ばんめ}は、{見本|みほん}では ') + (x.p ? shortTag(x.p) + fu(' の{中|なか}の ') : fu('{箱|はこ}の{外|そと}の ')) + shortTag(x.t) + fu(' です'), true);
    else setBubble(fu('{光|ひか}っている{箇所|かしょ}を{確認|かくにん}してください'), true);
    glowPos();
  } else {
    setBubble(fu('{正解|せいかい}の{形|かたち}はこちらです'), true);
    S.strip = treeStrip(tgB); $('#strip').innerHTML = S.strip; fitSample();
    glowPos();
  }
  return false;
}

function judge(){
  const st = cur(), types = S.blocks.map(b => b.type);
  clearHints();
  if (st.tree){ if (!judgeTree(st)) return; }
  else if (st.free){
    const used = ALL.filter(t => types.indexOf(t) >= 0);
    if (used.length < st.free){
      S.fails++; shakeDone();
      setBubble(fu('あと' + (st.free - used.length) + '{種類|しゅるい}の{部品|ぶひん}が{必要|ひつよう}です'), true);
      glowTray(ALL.filter(t => used.indexOf(t) < 0));
      return;
    }
  } else if (st.need){
    const miss = missingOf(st.need, types);
    if (miss.length){
      S.fails++; shakeDone();
      glowTray(miss);
      if (S.fails >= 3){ S.strip = stripHTML(st.need, false); $('#strip').innerHTML = S.strip; setBubble(fu('このブロックを{配置|はいち}してください'), true); }
      else setBubble(fu(S.fails === 1 ? '{惜|お}しい！もう{一度|いちど}{確認|かくにん}してみましょう' : '{光|ひか}っているブロックが{必要|ひつよう}です'), true);
      return;
    }
  } else {
    const tg = targetOf(st);
    const same = tg.length === types.length && tg.every((t, i) => t === types[i]);
    if (!same){
      S.fails++; shakeDone();
      if (st.k === 'c'){ setBubble(fu('{見本|みほん}と{比較|ひかく}して、もう{一度|いちど}{確認|かくにん}してみましょう'), true); return; }
      const miss = missingOf(tg, types), extra = extraIdx(tg, types);
      let wrong = 0; while (wrong < Math.max(tg.length, types.length) && tg[wrong] === types[wrong]) wrong++;
      const glowPos = () => {
        if (wrong < types.length) glowBlock(wrong, (wrong + 1) + '番目');
        else glowTray([tg[wrong]]);
      };
      if (S.fails === 1){
        setBubble(fu('{惜|お}しい！もう{一度|いちど}{確認|かくにん}してみましょう'), true);
        if (miss.length) glowTray(miss);
        else if (extra.length) extra.forEach(i => glowBlock(i));
        else glowPos();
      } else if (S.fails === 2){
        setBubble(fu('{光|ひか}っている{箇所|かしょ}を{確認|かくにん}してください'), true);
        glowPos();
      } else {
        setBubble(fu('{正解|せいかい}の{並|なら}び{順|じゅん}はこちらです'), true);
        S.strip = stripHTML(tg, true); $('#strip').innerHTML = S.strip; fitSample();
        glowPos();
      }
      return;
    }
  }
  const ei = flat(S.blocks).findIndex(isEmpty);
  if (ei >= 0){
    shakeDone();
    setBubble(fu('{空欄|くうらん}に{文字|もじ}を{入力|にゅうりょく}してください'), true);
    glowBlock(ei);
    const e = $$('#work .blk')[ei].querySelector('.inp.empty'); if (e) e.focus({preventScroll:true});
    return;
  }
  // 共通の部分の練習：3つのページを全部見てから正解にする
  if (st.pages && S.seen.length < PAGES.length){
    shakeDone();
    setBubble(fu('{形|かたち}は{正|ただ}しいです！{右|みぎ}の{画面|がめん}の{上|うえ}のタブで、まだ{見|み}ていないページも{見|み}てみましょう'), true);
    $$('.pgtab').forEach(t => { if (S.seen.indexOf(+t.dataset.pg) < 0) t.classList.add('glow'); });
    return;
  }
  success();
}

function success(){
  const st = cur();
  prog.cleared[st.id] = true; saveProg();
  confetti();
  const ni = followIdx();
  const last = ni < 0 && STAGES.every(s => prog.cleared[s.id]);
  // 練習10（自分のページ）はその場で保存できるようにする
  const canSave = st.free && S.screen === 'stage';
  modal('<div class="clearbox"><div class="bigstar" aria-hidden="true">★</div><div class="cl1">' + fu(last ? '{全|ぜん}ステージクリア！' : '{正解|せいかい}です！') + '</div>' +
    (st.why ? '<p class="why"><b>💡 ' + fu('なぜこの{箱|はこ}？') + '</b>' + fu(st.why) + '</p>' : '') +
    (canSave ? '<p class="savenote" id="saveNote">' + fu('{作|つく}ったページをファイルとして{保存|ほぞん}できます') + '</p><div class="mbtns"><button class="bigsub" id="mSave">💾 ' + fu('このページを{保存|ほぞん}') + '</button></div>' : '') +
    '<div class="mbtns">' + (ni >= 0 ? '<button class="bigok" id="mNext">' + fu('{次|つぎ}へ') + ' ▶</button>' : '') +
    '<button class="bigsub" id="mSel">' + fu('ステージ{選択|せんたく}') + '</button></div></div>', {noBackdrop:true});
  if ($('#mNext')) $('#mNext').addEventListener('click', () => { closeModal(); openStage(ni); });

  setBubble(fu('お{見事|みごと}です！'));

function followIdx(){

function confetti(){
  const box = document.createElement('div'); box.className = 'confetti';

// 並べたブロックを1つのHTMLファイルにする。forFile のときは画像をファイルの中に埋め込む（表示用は ねこ.svg と短く書く）
function blockLines(b, forFile){
  switch (b.type){
    case 'h1': case 'h2': case 'p': return ['<' + b.type + '>' + esc(b.text) + '</' + b.type + '>'];
    case 'strong': return ['<p><strong>' + esc(b.text) + '</strong></p>'];
    case 'hr': return ['<hr>'];
    case 'img': { const p = picById(b.pic); return ['<img src="' + (forFile ? picURI(p.id) : p.name + '.svg') + '" alt="' + esc(p.name) + '">']; }
    case 'a': return ['<a href="' + esc(b.href) + '">' + esc(b.text) + '</a>'];
    case 'ul': return ['<ul>'].concat(b.items.map(t => '  <li>' + esc(t) + '</li>'), ['</ul>']);
    case 'header': case 'main': case 'footer':
      return ['<' + b.type + '>'].concat([].concat.apply([], b.kids.map(k => blockLines(k, forFile))).map(l => '  ' + l), ['</' + b.type + '>']);
  }
  return [];
}
const pageTitle = blocks => ((flat(blocks).find(b => b.type === 'h1') || {}).text || '').trim() || '私のページ';
function pageLines(blocks, forFile){
  const body = [].concat.apply([], blocks.map(b => blockLines(b, forFile))).map(l => '    ' + l);
  return {head:['<!DOCTYPE html>', '<html lang="ja">', '  <head>', '    <meta charset="UTF-8">', '    <title>' + esc(pageTitle(blocks)) + '</title>', '  </head>', '  <body>'],
          body:body, foot:['  </body>', '</html>']};
}
function pageFileName(blocks){
  const t = pageTitle(blocks).replace(/[\\\/:*?"<>|\s]+/g, '').slice(0, 30);
  return (t || '私のページ') + '.html';
}
function downloadPage(blocks){
  const L = pageLines(blocks, true);
  const html = L.head.concat(L.body, L.foot).join('\n') + '\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], {type:'text/html'}));
  a.download = pageFileName(blocks);
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  return a.download;
}

// 入力されたコードを安全に表示する（使えるタグと属性だけ残す。画像名はアプリ内の絵に差し替え）
const PREV_OK = ['H1','H2','H3','P','UL','OL','LI','A','STRONG','B','EM','HR','IMG','BR'];
function safePreview(code){
  const doc = new DOMParser().parseFromString('<!doctype html><body>' + code + '</body>', 'text/html');
  const clean = node => {
    Array.from(node.childNodes).forEach(n => {
      if (n.nodeType === 3) return;
      if (n.nodeType !== 1 || n.tagName === 'SCRIPT' || n.tagName === 'STYLE'){ n.remove(); return; }
      clean(n);
      if (PREV_OK.indexOf(n.tagName) < 0){ n.replaceWith.apply(n, Array.from(n.childNodes)); return; }
      Array.from(n.attributes).forEach(a => { if (['href','src','alt'].indexOf(a.name) < 0) n.removeAttribute(a.name); });
      if (n.tagName === 'A'){ if (/^\s*javascript:/i.test(n.getAttribute('href') || '')) n.removeAttribute('href'); n.setAttribute('draggable', 'false'); }
      if (n.tagName === 'IMG'){
        const p = PICS.find(x => x.name + '.svg' === (n.getAttribute('src') || ''));
        if (p) n.setAttribute('src', picURI(p.id)); else n.removeAttribute('src');
      }
    });
  };
  clean(doc.body);
  return doc.body.innerHTML;
}
const parseTpl = t => t.split(/\[\[(.*?)\]\]/).map((s, i) => i % 2 ? {a:s} : s);
const itemCode = it => it.line || parseTpl(it.t).map(p => typeof p === 'string' ? p : p.a).join('');
// 問題文のコード（固定部分）に色を付ける。完全なタグは説明・使用例が出るようにする
function codeLit(s){
  return esc(s).replace(/&lt;(\/?)(\w+)(.*?)&gt;|([^\x00-\x7f]+)/g, (m, sl, name, attrs, jp) => {

    return '<span class="ct' + (sl ? ' cl' : '') + '" data-tag="' + name.toLowerCase() + '">&lt;' + sl + name + attrs + '&gt;</span>';
  });
}

// 1行入力のまちがいの見つけ方（よくある順に確認）
function lineDiag(v, ans){
  // 3回目からは理由に加えて正解の例も見せる
  return diagReason(v, ans) + (S.fails >= 3 ? '<br>{正解|せいかい}の{例|れい}：<code>' + esc(ans) + '</code>' : '');
}
function diagReason(v, ans){
  if (!v) return '{何|なに}も{入力|にゅうりょく}されていません';
  if (v[0] !== '<') return '{最初|さいしょ}は &lt; から{始|はじ}めます';
  const want = ans.match(/^<(\w+)/)[1], got = (v.match(/^<\s*(\w+)/) || [])[1];
  if (!got || got.toLowerCase() !== want) return 'タグの{名前|なまえ}を{確認|かくにん}してください（&lt;' + want + '&gt; を{使|つか}います）';
  if (ans.indexOf('</') >= 0 && v.indexOf('</') < 0) return '{終了|しゅうりょう}タグ（&lt;/' + want + '&gt;）がありません';
  if (ans.indexOf('</') >= 0 && !new RegExp('</' + want + '>$', 'i').test(v)) return '{終了|しゅうりょう}タグの{書|か}き{方|かた}を{確認|かくにん}してください';
  return '{記号|きごう}（&lt; &gt; / " =）の{位置|いち}や{数|かず}を{確認|かくにん}してください';
}
// 答え合わせの結果を、各欄の横の ○ / ✕ と、コードの下の1行で見せる
function showMarks(ins, okArr){
  ins.forEach((x, k) => {
    let m = x.nextElementSibling;
    if (!m || !m.classList.contains('tmark')){ m = document.createElement('span'); x.after(m); }
    m.className = 'tmark ' + (okArr[k] ? 'ok' : 'ng');
    m.textContent = okArr[k] ? '○' : '✕';
    m.setAttribute('aria-label', okArr[k] ? '正解' : '不正解');
  });
  const ng = okArr.filter(v => !v).length, r = $('#tresult');
  r.hidden = false;
  r.className = 'tresult ' + (ng ? 'ng' : 'ok');
  r.innerHTML = ng ? '✕ ' + fu(okArr.length > 1 ? ng + 'か{所|しょ}まちがいがあります（✕の{欄|らん}）' : 'まちがいがあります') : '○ ' + fu('{正解|せいかい}です');
}

function typeJudge(){
  const st = cur(), it = st.items[S.item], ins = $$('#typeArea .tinp');
  ins.forEach(x => x.classList.remove('glow', 'ok'));
  const ans = it.line ? null : parseTpl(it.t).filter(p => typeof p !== 'string').map(p => p.a);
  const okArr = ins.map((x, k) => !FULLW.test(x.value) && (it.line
    ? it.re.test(x.value.trim().replace(/>\s+</g, '><'))
    : x.value.trim().toLowerCase() === ans[k].toLowerCase()));
  showMarks(ins, okArr);
  const fw = ins.filter(x => FULLW.test(x.value));
  if (fw.length){
    fw.forEach(x => x.classList.add('glow')); shakeDone();
    setBubble(fu('{全角|ぜんかく}の{文字|もじ}が{混|ま}ざっています。{半角英数字|はんかくえいすうじ}（{日本語入力|にほんごにゅうりょく}オフ）で{入力|にゅうりょく}してください'), true);
    return;
  }
  let ok, msg = '';
  if (it.line){
    const v = ins[0].value.trim().replace(/>\s+</g, '><');
    ok = okArr[0];
    if (!ok){ S.fails++; msg = lineDiag(v, it.line); ins[0].classList.add('glow'); }
  } else {
    const bad = ins.filter((x, k) => !okArr[k]);
    ok = !bad.length;
    if (!ok){
      S.fails++;
      bad.forEach(x => x.classList.add('glow'));
      if (S.fails === 1) msg = '{惜|お}しい！{光|ひか}っている{欄|らん}を{確認|かくにん}してください';
      else if (S.fails === 2) msg = 'ヒント：' + bad.map(x => '「<code>' + esc(ans[+x.dataset.k].charAt(0)) + '</code>」').join('、') + ' から{始|はじ}まります';
      else msg = '{正解|せいかい}は ' + bad.map(x => '<code>' + esc(ans[+x.dataset.k]) + '</code>').join('、') + ' です。{入力|にゅうりょく}してみましょう';
    }
  }
  if (!ok){ shakeDone(); setBubble(fu(msg), true); return; }
  ins.forEach(x => x.classList.add('ok'));
  if (S.item < st.items.length - 1){
    setBubble(fu('{正解|せいかい}です！'));
    $('#doneBtn').hidden = true; $('#nextQ').hidden = false; $('#nextQ').focus();
  } else success();
}

  document.body.classList.toggle('nofuri', !prog.furi);
  $('#furiBtn').setAttribute('aria-pressed', prog.furi);
  fitSample();   // ふりがなで高さが変わるので、見本と画面をそろえ直す
}
$('#furiBtn').addEventListener('click', () => { prog.furi = !prog.furi; saveProg(); applyFuri(); });
$('#guideBtn').addEventListener('click', () => showGuide());
$('#backBtn').addEventListener('click', () => { closeModal(); renderSelect(); });

/* ===================== はじまり ===================== */
applyFuri();
renderSelect();
if (!prog.guide) showGuide(() => { prog.guide = true; saveProg(); });

})();
</script>
</body>
</html>
